mode: basic
cube_size: 0.6
field_length: 2.0
field_width: 1.2
depth_min: 0.3
depth_max: 3.0
flying_pixel_m: 0.08
ground_ransac_thresh: 0.015
ground_max_angle_deg: 8.0
min_face_pixels: 400
# Footprint must cover this fraction of the 0.6 m square before the basic detector accepts it.
min_footprint_fraction: 0.45
size_tolerance: 0.18
frames_to_fuse: 15
extrinsic_path: config/extrinsic.yaml
# Basic project does not call the grazing-angle fitter.
enable_face_fallback: false
colors:
  - name: red
    hsv_low: [0, 80, 60]
    hsv_high: [10, 255, 255]
    front: true
  - name: red_high
    hsv_low: [170, 80, 60]
    hsv_high: [180, 255, 255]
    front: true
  - name: blue
    hsv_low: [100, 80, 60]
    hsv_high: [130, 255, 255]
    front: false
  - name: yellow
    hsv_low: [20, 80, 60]
    hsv_high: [35, 255, 255]
    front: false
