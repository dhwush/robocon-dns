mode: basic
cube_size: 0.6
field_length: 2.0
field_width: 1.2
depth_min: 0.3
depth_max: 3.0
flying_pixel_m: 0.08
# 地面 RANSAC。方块投影到这块地面上，不另拟合上表面，因此不算顶面 RMS、12° 法向和 6 mm 残差。
ground_ransac_thresh: 0.008
ground_ransac_iterations: 80
ground_max_angle_deg: 8.0
min_face_pixels: 400
# 足迹面积低于这个比例就丢帧。长边另有 12% 相对上限，短边短于 0.45 倍边长也丢帧。
min_footprint_fraction: 0.45
size_tolerance: 0.18
frames_to_fuse: 15
min_samples: 8
output_hz: 10
hold_s: 0.5
jump_m: 0.03
fps: 30
hsv_calib_frames: 30
hsv_path: config/hsv.yaml
extrinsic_path: config/extrinsic.yaml
# 基本要求不调用掠射补救。补救不是顶面拟合，打开后也只在可见面检测拒绝时才跑。
enable_face_fallback: false
colors:
  - name: red
    hsv_low: [0, 80, 60]
    hsv_high: [10, 255, 255]
    front: true
  - name: red_high
    hsv_low: [170, 80, 60]
    hsv_high: [180, 255, 255]
    front: true
  - name: blue
    hsv_low: [100, 80, 60]
    hsv_high: [130, 255, 255]
    front: false
  - name: yellow
    hsv_low: [20, 80, 60]
    hsv_high: [35, 255, 255]
    front: false
